<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu cuenta - ATIS-J TECHNOLOGY</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/registrar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <video class="video-fondo" autoplay muted loop playsinline>
        <source src="videos/matrix-azul.mp4" type="video/mp4">
    </video>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html" class="logo-link">
                <img src="img/logo-atisj.png" alt="ATISJ" class="logo-img">
            </a>
        </div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="cursos.html">Cursos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="cursos2.html">Mis cursos</a>
        </nav>
        <div class="auth-buttons">
            <a href="registrar.html" class="btn-primary-outline active">Crear cuenta</a>
        </div>
    </header>

    <!-- Formulario de Registro -->
    <main class="auth-container">
        <div class="auth-card">
            <h1>Crea tu cuenta</h1>
            <p class="auth-subtitle">Regístrate para comprar cursos y entrar a tu aula en línea.</p>

            <button class="btn-google" type="button" onclick="loginConGoogle()">
                <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continuar con Google
            </button>

            <div class="divider">
                <span>o con tu correo</span>
            </div>

            <form id="register-form">
                <div class="input-group">
                    <input type="text" id="fullname" placeholder="Tu nombre" required>
                </div>
                <div class="input-group">
                    <input type="email" id="reg-email" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="input-group">
                    <input type="password" id="reg-password" placeholder="Contraseña (mínimo 6 caracteres)" required minlength="6">
                </div>

                <button type="submit" class="btn-submit">Crear cuenta</button>
            </form>

            <div class="auth-footer">
                <span>¿Ya tienes cuenta? <a href="iniciar.html" class="auth-link">Entra aquí</a></span>
            </div>
        </div>
    </main>

    <!-- El orden importa: librería → conexión → lógica -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="java/supabase-client.js"></script>
    <script src="java/navbar.js"></script>
    <script src="java/registrar.js"></script>
</body>
</html>
