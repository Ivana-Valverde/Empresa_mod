<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ATIS-J Technology</title>
    <link rel="stylesheet" href="css/styles.css?v=20.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #030712;
            color: #f9fafb;
            line-height: 1.5;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: rgba(3, 7, 18, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-img {
            width: 160px;
            height: auto;
            display: block;
        }

        .secure-badge {
            color: #38bdf8;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            gap: 30px;
            max-width: 1150px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .checkout-box {
            background: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .checkout-box h2 {
            font-size: 1.25rem;
            color: #38bdf8;
            font-weight: 800;
            margin-bottom: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.85rem;
            color: #9ca3af;
            font-weight: 600;
        }

        .form-group input, 
        .form-group select {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 11px 14px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .info-alert {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 10px;
            padding: 12px 16px;
            margin: 20px 0;
            font-size: 0.83rem;
            color: #e0f2fe;
        }

        .terms-group {
            margin-bottom: 24px;
        }

        .checkbox-label {
            font-size: 0.83rem;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-pay {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
        }

        .cart-items-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .coupon-box {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .coupon-box input {
            flex-grow: 1;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 9px 12px;
            color: #ffffff;
        }

        .coupon-box button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 9px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .grand-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: 900;
            color: #ffffff;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
        }

        .grand-total span:last-child {
            color: #38bdf8;
        }

        @media (max-width: 850px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <video class="video-fondo" autoplay muted loop playsinline>
        <source src="videos/matrix-azul.mp4" type="video/mp4">
    </video>

    <!-- Header Navbar -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html" class="logo-link">
                <img src="img/logo-atisj.png" alt="ATISJ" class="logo-img">
            </a>
        </div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="cursos.html">Cursos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="cursos2.html">Plataforma</a>
        </nav>
        <div class="auth-buttons">
            <a href="pagos.html" class="btn-primary-outline" id="cartBtn">🛒 Carrito (0)</a>
        </div>
    </header>

    <!-- Layout Principal -->
    <main class="checkout-layout">
        
        <!-- DATOS DEL ALUMNO -->
        <section class="checkout-box">
            <h2>DATOS DEL ALUMNO</h2>
            <form id="paymentForm">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="nombres">Nombres completos</label>
                        <input type="text" id="nombres" placeholder="Ingresa tus nombres" required>
                    </div>

                    <div class="form-group">
                        <label for="paterno">Apellido paterno</label>
                        <input type="text" id="paterno" placeholder="Ingresa tu apellido" required>
                    </div>

                    <div class="form-group">
                        <label for="materno">Apellido materno</label>
                        <input type="text" id="materno" placeholder="Ingresa tu apellido" required>
                    </div>

                    <div class="form-group">
                        <label for="celular">Número de celular</label>
                        <input type="tel" id="celular" placeholder="Ingresa tu número celular" required>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" placeholder="Ingresa tu correo" required>
                    </div>

                    <div class="form-group">
                        <label for="tipoDoc">Tipo de documento</label>
                        <select id="tipoDoc" required>
                            <option value="" disabled selected>Seleccione una opción</option>
                            <option value="dni">DNI</option>
                            <option value="ce">Carnet de Extranjería</option>
                            <option value="pasaporte">Pasaporte</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="documento">Número de documento</label>
                        <input type="text" id="documento" placeholder="Ingresa tu documento" required>
                    </div>
                </div>

                <div class="info-alert">
                    <span>ℹ️ Asegúrate de ingresar bien tus datos. Se usarán para la inscripción y acceso al curso.</span>
                </div>

                <div class="terms-group">
                    <label class="checkbox-label">
                        <input type="checkbox" required> Acepto las condiciones y aviso sobre tratamiento de datos personales
                    </label>
                </div>

                <button type="submit" class="btn-pay">CONTINUAR AL PAGO ➔</button>
            </form>
        </section>

        <!-- RESUMEN DE COMPRA -->
        <section class="checkout-box">
            <h2>RESUMEN DE COMPRA</h2>
            
            <div id="cartItemsList" class="cart-items-container">
                <!-- Se llena con JS -->
            </div>

            <div class="coupon-box">
                <input type="text" placeholder="Ingresa tu cupón">
                <button type="button">VALIDAR</button>
            </div>

            <div class="grand-total">
                <span>TOTAL</span>
                <span id="grandTotal">S/.0.00 PEN</span>
            </div>
        </section>
    </main>

    <!-- Script embebido de sincronización -->
   <!-- Script de sincronización con validación de campos completos -->
   <script>
    // Cargar los cursos en el resumen de compra al abrir la página
    function cargarResumenCompra() {
        const carrito = JSON.parse(localStorage.getItem('atisj_carrito')) || [];
        const container = document.getElementById('cartItemsList');
        const totalElement = document.getElementById('grandTotal');
        const btnCart = document.getElementById('cartBtn');

        if (btnCart) {
            btnCart.textContent = `🛒 Carrito (${carrito.length})`;
        }

        if (!container || !totalElement) return;

        if (carrito.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; color: #9ca3af; padding: 20px 0;">
                    <p style="margin-bottom: 10px;">No has seleccionado ningún curso aún.</p>
                    <a href="cursos.html" style="color: #38bdf8; text-decoration: none; font-weight: bold;">← Ver catálogo de cursos</a>
                </div>
            `;
            totalElement.textContent = 'S/.0.00 PEN';
            return;
        }

        let sumaTotal = 0;

        container.innerHTML = carrito.map((item, index) => {
            const precioNum = Number(item.precio) || 0;
            sumaTotal += precioNum;

            return `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #161b22; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px;">
                    <div>
                        <div style="color: #ffffff; font-weight: 600; font-size: 0.95rem;">${item.titulo}</div>
                        <div style="color: #38bdf8; font-weight: 700; font-size: 0.9rem;">S/.${precioNum.toFixed(2)} PEN</div>
                    </div>
                    <button type="button" onclick="eliminarCurso(${index})" style="background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 1.2rem;" title="Eliminar">✕</button>
                </div>
            `;
        }).join('');

        totalElement.textContent = `S/.${sumaTotal.toFixed(2)} PEN`;
    }

    function eliminarCurso(index) {
        let carrito = JSON.parse(localStorage.getItem('atisj_carrito')) || [];
        carrito.splice(index, 1);
        localStorage.setItem('atisj_carrito', JSON.stringify(carrito));
        cargarResumenCompra();
    }

    // VALIDACIÓN AL HACER CLIC EN "CONTINUAR AL PAGO"
    document.getElementById('paymentForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // 1. Obtener valores de cada campo
        const datosAlumno = {
            nombres: document.getElementById('nombres').value.trim(),
            paterno: document.getElementById('paterno').value.trim(),
            materno: document.getElementById('materno').value.trim(),
            celular: document.getElementById('celular').value.trim(),
            correo: document.getElementById('correo').value.trim(),
            tipoDoc: document.getElementById('tipoDoc').value,
            documento: document.getElementById('documento').value.trim()
        };

        const checkbox = this.querySelector('input[type="checkbox"]').checked;
        const carrito = JSON.parse(localStorage.getItem('atisj_carrito')) || [];

        // 2. Comprobar que NO haya campos vacíos
        if (!datosAlumno.nombres || !datosAlumno.paterno || !datosAlumno.materno || 
            !datosAlumno.celular || !datosAlumno.correo || !datosAlumno.tipoDoc || !datosAlumno.documento) {
            alert('⚠️ Debes rellenar todos los campos del formulario para continuar.');
            return;
        }

        // 3. Comprobar términos
        if (!checkbox) {
            alert('⚠️ Debes aceptar los términos y condiciones sobre el tratamiento de datos.');
            return;
        }

        // 4. Comprobar que haya cursos en el carrito
        if (carrito.length === 0) {
            alert('⚠️ Tu carrito está vacío. Agrega al menos un curso antes de proceder al pago.');
            return;
        }

        // 5. Guardar los datos en localStorage y redirigir a pago2.html
        localStorage.setItem('atisj_datos_alumno', JSON.stringify(datosAlumno));
        window.location.href = 'pago2.html';
    });

    window.addEventListener('DOMContentLoaded', cargarResumenCompra);
</script>
</body>
</html>
